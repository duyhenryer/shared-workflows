# Copy to a Go service as .github/workflows/check.yml.
# Resolve v2 and replace it with the immutable commit SHA before merging.
name: Check

on:
  pull_request:
    branches: [dev, main]

permissions: {}

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    uses: duynhlab/gha-workflows/.github/workflows/check.yml@v2
    with:
      image-name: my-service
      sonar-project-key: my-org_my-service
      sonar-organization: my-org
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
