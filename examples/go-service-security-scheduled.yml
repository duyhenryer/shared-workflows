name: Security scheduled

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-scheduled
  cancel-in-progress: true

jobs:
  security:
    uses: duynhlab/gha-workflows/.github/workflows/go-security.yml@v2
    with:
      go-version-file: go.mod
      govulncheck-enforce: true
      scan-actions: false
    permissions:
      actions: read
      contents: read
      security-events: write
