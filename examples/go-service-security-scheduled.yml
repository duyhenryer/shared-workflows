# Copy to a Go service repo as .github/workflows/security-scheduled.yml
#
# Weekly re-scan of source and dependencies, kept in its own caller so it can
# never build an image, push to GHCR, or trigger a Flux deployment.
#
# Dependency Review self-skips here (no dependency diff outside a pull request)
# and the Security Gate accounts for that.
#
# Stagger the cron minute across repository groups — a daily "0 2 * * *" on
# dozens of services is a thundering herd on the runner pool:
#   Group A: '17 2 * * 1'
#   Group B: '29 2 * * 1'
#   Group C: '41 2 * * 1'

name: Security Scheduled

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

# Deny by default at the top level; the job grants exactly what it needs.
permissions: {}

concurrency:
  group: security-scheduled-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-security:
    uses: duynhlab/gha-workflows/.github/workflows/go-security.yml@main
    with:
      go-version-file: go.mod
      go-working-directory: .
      govulncheck-enforce: true
      scan-actions: false
      license-enforce: false
    permissions:
      actions: read
      contents: read
      security-events: write
