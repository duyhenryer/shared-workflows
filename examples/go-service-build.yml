# Copy to a Go service as .github/workflows/build.yml.
# Resolve v2 and replace it with the immutable commit SHA before merging.
name: Build dev image

on:
  push:
    branches: [dev]

permissions: {}

concurrency:
  group: build-dev
  cancel-in-progress: true

jobs:
  build:
    uses: duynhlab/gha-workflows/.github/workflows/build.yml@v2
    with:
      image-name: my-service
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
